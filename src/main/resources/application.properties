spring.application.name=pushkar-portfolio
server.port=${PORT:8080}
server.compression.enabled=true
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never

# Templates are cached unless you are editing them: THYMELEAF_CACHE=false mvn spring-boot:run
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# Fingerprint /css and /js URLs so browsers cache them safely.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**
spring.web.resources.cache.cachecontrol.max-age=7d

# Public address of the site, used for canonical and Open Graph URLs. Leave empty locally.
portfolio.site-url=${PORTFOLIO_SITE_URL:}

# Where contact messages are stored (one JSON object per line).
portfolio.contact.storage-path=${CONTACT_STORAGE_PATH:data/messages.jsonl}
portfolio.contact.max-per-hour=5
